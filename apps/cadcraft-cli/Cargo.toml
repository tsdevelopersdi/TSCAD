[package]
name = "cadcraft-cli"
description = "TSCAD command-line tool: info, convert, run scripts, export, commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "cadcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "tscad-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-mcp = { workspace = true }
cadcraft-render = { workspace = true }
clap = { workspace = true }
same-file = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Shell completions and man pages (examples/man-and-completions.rs, for the Linux packages); not
# in the binary.
clap_complete = { workspace = true }
clap_mangen = { workspace = true }

[build-dependencies]
winresource = "0.1"
